<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌈 Learn & Play!</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:    #e91e8c;
      --purple:  #7b1fa2;
      --blue:    #1a237e;
      --olive:   #6d8c3e;
      --red:     #c62828;
      --white:   #ffffff;
      --cream:   #f4f0ff;
      --dark:    #1a237e;
      --shadow:  0 8px 32px rgba(26,35,126,.18);
    }

    html, body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #fce4ff 0%, #e8eeff 50%, #e8f5e9 100%);
      overflow: hidden;
    }

    body::before {
      content: '🌟🦋🎈🌸🎀🍭🌈🦄🎠🌟🎁🐾';
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      font-size: 1.8rem; opacity: .06;
      white-space: nowrap;
      letter-spacing: 70px;
      line-height: 110px;
      pointer-events: none;
      z-index: 0;
      word-break: break-all;
    }

    #login-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10; padding: 1rem;
    }

    .login-card {
      background: white; border-radius: 32px;
      padding: 2.5rem 2rem; width: min(480px, 100%);
      box-shadow: 0 20px 60px rgba(123,31,162,.22), 0 4px 16px rgba(0,0,0,.08);
      border: 4px solid var(--purple); position: relative;
      animation: popIn .6s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn {
      from { transform: scale(.7) translateY(40px); opacity: 0; }
      to   { transform: scale(1) translateY(0);     opacity: 1; }
    }

    .login-deco {
      position: absolute; top: -32px; left: 50%; transform: translateX(-50%);
      font-size: 3.5rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,.2));
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(-12px); }
    }

    .login-title {
      font-family: 'Fredoka One', cursive; font-size: 2.2rem;
      text-align: center; margin-top: .8rem;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-subtitle { text-align: center; color: #888; font-size: .95rem; margin-bottom: 1.8rem; font-weight: 600; }
    .field-label { font-weight: 800; font-size: 1rem; color: var(--dark); margin-bottom: .4rem; display: flex; align-items: center; gap: .4rem; }
    .field-group { margin-bottom: 1.2rem; }

    .fancy-input {
      width: 100%; padding: .85rem 1.1rem; border-radius: 16px;
      border: 3px solid #c5cae9; font-family: 'Nunito', sans-serif;
      font-size: 1.05rem; font-weight: 700; color: var(--dark);
      background: #f3f0ff; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .fancy-input:focus { border-color: var(--purple); box-shadow: 0 0 0 4px rgba(123,31,162,.15); }

    .cf-widget-wrap { margin: 1rem 0; display: flex; justify-content: center; }

    .login-btn {
      width: 100%; padding: 1rem; border-radius: 20px; border: none; cursor: pointer;
      font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: white;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      box-shadow: 0 6px 20px rgba(26,35,126,.35);
      transition: transform .15s, box-shadow .15s; letter-spacing: .5px;
    }
    .login-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(26,35,126,.45); }
    .login-btn:active:not(:disabled) { transform: translateY(0); }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }

    .login-error {
      background: #ffebee; color: var(--red); border-radius: 12px;
      padding: .7rem 1rem; font-weight: 700; font-size: .9rem;
      margin-top: .8rem; display: none; border: 2px solid #ef9a9a;
    }

    #chat-screen { display: none; position: fixed; inset: 0; flex-direction: column; z-index: 5; }

    .chat-header {
      background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
      color: white; padding: .7rem 1.2rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; box-shadow: 0 4px 16px rgba(26,35,126,.3);
      flex-shrink: 0; flex-wrap: wrap; position: relative; z-index: 20;
    }
    .header-left { display: flex; align-items: center; gap: .8rem; }

    .menu-btn {
      background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.4);
      border-radius: 12px; color: white; cursor: pointer;
      width: 42px; height: 42px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
      padding: 0; flex-shrink: 0; transition: background .2s;
    }
    .menu-btn:hover { background: rgba(255,255,255,.32); }
    .menu-btn span { display: block; width: 20px; height: 2.5px; background: white; border-radius: 2px; }

    .header-info { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    .header-chip {
      background: rgba(255,255,255,.2); border-radius: 20px; padding: .3rem .9rem;
      font-weight: 800; font-size: .85rem; display: flex; align-items: center; gap: .3rem;
      backdrop-filter: blur(4px); border: 1.5px solid rgba(255,255,255,.35);
    }

    /* ===== MUSIC INDICATOR ===== */
    .music-indicator {
      display: none; align-items: center; gap: .5rem;
      background: rgba(255,255,255,.18);
      border: 1.5px solid rgba(255,255,255,.35);
      border-radius: 20px; padding: .28rem .85rem;
      font-size: .8rem; font-weight: 700; color: rgba(255,255,255,.95);
      backdrop-filter: blur(4px); letter-spacing: .2px;
      animation: fadeInPop .3s ease;
    }
    .music-indicator.show { display: flex; }
    @keyframes fadeInPop {
      from { transform: scale(.8); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }
    .music-bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
    .music-bars span {
      display: block; width: 3px; border-radius: 2px;
      background: rgba(255,255,255,.9);
      animation: musicBar 0.8s ease-in-out infinite alternate;
    }
    .music-bars span:nth-child(1) { height: 4px;  animation-delay: 0s;    animation-duration: 0.55s; }
    .music-bars span:nth-child(2) { height: 12px; animation-delay: 0.12s; animation-duration: 0.85s; }
    .music-bars span:nth-child(3) { height: 7px;  animation-delay: 0.27s; animation-duration: 0.65s; }
    .music-bars span:nth-child(4) { height: 14px; animation-delay: 0.08s; animation-duration: 1.0s; }
    .music-bars span:nth-child(5) { height: 5px;  animation-delay: 0.22s; animation-duration: 0.72s; }
    @keyframes musicBar {
      from { transform: scaleY(.25); }
      to   { transform: scaleY(1);   }
    }
    /* ========================== */

    .student-badge {
      background: var(--pink); color: white; border-radius: 22px;
      padding: .4rem 1.1rem; font-family: 'Fredoka One', cursive; font-size: 1.05rem;
      display: flex; align-items: center; gap: .4rem;
      box-shadow: 0 3px 10px rgba(0,0,0,.2); animation: wobble 3s ease-in-out infinite;
    }
    @keyframes wobble { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }

    .chat-body { display: flex; flex: 1; overflow: hidden; position: relative; }

    .drawer-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(26,35,126,.45); z-index: 100;
      backdrop-filter: blur(2px); animation: fadeIn .25s ease;
    }
    .drawer-overlay.open { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .drawer {
      position: fixed; top: 0; left: -320px; width: 300px; max-width: 85vw; height: 100%;
      background: linear-gradient(180deg, #e8eeff 0%, #f3e5ff 60%, #e8f5e9 100%);
      z-index: 110; display: flex; flex-direction: column;
      box-shadow: 4px 0 24px rgba(26,35,126,.22);
      transition: left .3s cubic-bezier(.4,0,.2,1); overflow: hidden;
    }
    .drawer.open { left: 0; }

    .drawer-header {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: white; padding: 1rem 1.2rem;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; gap: .8rem;
    }
    .drawer-title { font-family: 'Fredoka One', cursive; font-size: 1.25rem; display: flex; align-items: center; gap: .4rem; }
    .drawer-close {
      background: rgba(255,255,255,.2); border: none; color: white;
      border-radius: 50%; width: 34px; height: 34px; font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s;
    }
    .drawer-close:hover { background: rgba(255,255,255,.35); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 1rem .8rem; display: flex; flex-direction: column; gap: .7rem; }
    .drawer-section-label {
      font-family: 'Fredoka One', cursive; font-size: .9rem; color: var(--purple);
      text-align: center; padding: .4rem 0 .6rem; border-bottom: 2px dashed var(--purple);
      display: flex; align-items: center; gap: .4rem; justify-content: center;
    }

    .curr-card {
      background: white; border-radius: 16px; padding: .85rem 1rem;
      box-shadow: 0 3px 12px rgba(26,35,126,.09); border: 2.5px solid #c5cae9;
      cursor: pointer; transition: transform .2s, border-color .2s, box-shadow .2s;
      display: flex; align-items: flex-start; gap: .6rem;
    }
    .curr-card:hover { transform: translateY(-2px); border-color: var(--pink); box-shadow: 0 6px 20px rgba(233,30,140,.18); }
    .curr-card:active { transform: scale(.97); }
    .curr-card.active { border-color: var(--olive); background: linear-gradient(135deg, #f0fff4, #e8f5e9); box-shadow: 0 4px 16px rgba(109,140,62,.2); }

    .curr-emoji { font-size: 1.4rem; flex-shrink: 0; margin-top: .1rem; }
    .curr-content { flex: 1; min-width: 0; }
    .curr-title { font-weight: 800; font-size: .88rem; color: var(--dark); line-height: 1.35; word-break: break-word; }
    .curr-sub { font-size: .72rem; color: #888; font-weight: 600; margin-top: .25rem; }
    .progress-bar-wrap { background: #e8eeff; border-radius: 10px; height: 8px; overflow: hidden; margin-top: .45rem; }
    .progress-bar-fill { height: 100%; border-radius: 10px; transition: width .8s cubic-bezier(.34,1.56,.64,1); background: linear-gradient(90deg, var(--olive), var(--blue)); }
    .progress-label { font-size: .7rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; margin-top: .3rem; color: #777; }
    .stage-badge { border-radius: 10px; padding: .15rem .55rem; font-size: .68rem; font-weight: 800; letter-spacing: .3px; }
    .stage-yet      { background: #ede7f6; color: var(--purple); }
    .stage-progress { background: #fff3e0; color: #e65100; }
    .stage-done     { background: #e8f5e9; color: var(--olive); }

    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--cream); position: relative; }
    .chat-area::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(123,31,162,.05) 70px, transparent 70px),
        radial-gradient(circle at 82% 72%, rgba(26,35,126,.05) 55px, transparent 55px),
        radial-gradient(circle at 50% 50%, rgba(109,140,62,.04) 90px, transparent 90px);
      pointer-events: none;
    }

    .messages-wrap { flex: 1; overflow-y: auto; padding: 1.2rem 1rem; display: flex; flex-direction: column; gap: .8rem; scroll-behavior: smooth; }

    .msg { display: flex; align-items: flex-end; gap: .6rem; animation: slideUp .35s ease; max-width: 80%; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .msg-user   { align-self: flex-end; flex-direction: row-reverse; max-width: 82%; }
    .msg-system { align-self: flex-start; max-width: 82%; }

    .msg-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.15); overflow: hidden; }
    .avatar-user   { background: linear-gradient(135deg, var(--blue), var(--purple)); }
    .avatar-system { background: linear-gradient(135deg, var(--olive), var(--blue)); }
    .avatar-system img, .avatar-user img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .msg-bubble { padding: .75rem 1.1rem; border-radius: 20px; font-size: .95rem; font-weight: 600; line-height: 1.5; max-width: 100%; position: relative; }
    .msg-user .msg-bubble { background: linear-gradient(135deg, var(--blue), var(--purple)); color: white; border-bottom-right-radius: 6px; box-shadow: 0 4px 14px rgba(26,35,126,.28); }
    .msg-system .msg-bubble { background: white; color: var(--dark); border-bottom-left-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.09); border: 2px solid #c5cae9; }

    .typing-indicator { display: none; align-self: flex-start; align-items: flex-end; gap: .6rem; }
    .typing-indicator.show { display: flex; }
    .typing-dots { background: white; border: 2px solid #c5cae9; border-radius: 20px; border-bottom-left-radius: 6px; padding: .7rem 1.1rem; display: flex; gap: 5px; align-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.08); }
    .typing-dots span { width: 8px; height: 8px; background: var(--purple); border-radius: 50%; display: inline-block; animation: typingBounce 1.2s ease-in-out infinite; }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes typingBounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }

    .input-bar { padding: .8rem 1rem; background: white; border-top: 3px solid #c5cae9; display: flex; gap: .6rem; align-items: flex-end; box-shadow: 0 -4px 16px rgba(26,35,126,.07); flex-shrink: 0; }

    .input-textarea { flex: 1; resize: none; border: 3px solid #c5cae9; border-radius: 18px; padding: .7rem 1rem; font-family: 'Nunito', sans-serif; font-size: .95rem; font-weight: 700; color: var(--dark); background: #f3f0ff; outline: none; max-height: 120px; transition: border-color .2s; line-height: 1.4; }
    .input-textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(123,31,162,.12); }
    .input-textarea:disabled { opacity: .5; cursor: not-allowed; }

    .word-count { font-size: .72rem; font-weight: 700; color: #bbb; text-align: right; margin-top: .2rem; padding-right: .3rem; }
    .word-count.warn { color: var(--red); }
    .input-col { flex: 1; display: flex; flex-direction: column; }

    .icon-btn { width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; transition: transform .15s, box-shadow .15s; flex-shrink: 0; }
    .icon-btn:hover:not(:disabled) { transform: scale(1.1); }
    .icon-btn:disabled { opacity: .45; cursor: not-allowed; }

    .btn-voice { background: linear-gradient(135deg, var(--olive), #388e3c); color: white; box-shadow: 0 4px 14px rgba(109,140,62,.35); }
    .btn-voice.recording { background: linear-gradient(135deg, var(--red), #e53935); animation: pulse 1s ease-in-out infinite; box-shadow: 0 4px 14px rgba(198,40,40,.5); }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    .btn-send { background: linear-gradient(135deg, var(--pink), var(--purple)); color: white; box-shadow: 0 4px 14px rgba(123,31,162,.35); }

    .messages-wrap::-webkit-scrollbar, .drawer-body::-webkit-scrollbar { width: 6px; }
    .messages-wrap::-webkit-scrollbar-track, .drawer-body::-webkit-scrollbar-track { background: transparent; }
    .messages-wrap::-webkit-scrollbar-thumb { background: rgba(123,31,162,.28); border-radius: 3px; }
    .drawer-body::-webkit-scrollbar-thumb { background: rgba(26,35,126,.22); border-radius: 3px; }

    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.4); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: .4rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .header-chip { font-size: .75rem; padding: .25rem .65rem; }
      .student-badge { font-size: .9rem; padding: .35rem .85rem; }
      .msg { max-width: 90%; }
      .msg-user, .msg-system { max-width: 90%; }
      .drawer { width: 280px; }
      .music-indicator { font-size: .72rem; padding: .22rem .6rem; }
    }
    @media (max-width: 380px) {
      .header-chip:not(:first-child) { display: none; }
      .music-indicator { display: none !important; }
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-deco">🎒</div>
    <h1 class="login-title">Learn with Maria! 🌈</h1>
    <p class="login-subtitle">Let's start today's adventure! 🦋✨</p>

    <div class="field-group">
      <div class="field-label">🔑 Lesson Code</div>
      <input class="fancy-input" id="lesson-code" type="text"
             placeholder="Enter your lesson code… 🎯" autocomplete="off" />
    </div>

    <div class="field-group">
      <div class="field-label">🌟 Your Name</div>
      <input class="fancy-input" id="student-name-input" type="text"
             placeholder="What's your name? 😊" autocomplete="off" />
    </div>

    <div class="cf-widget-wrap">
      <div id="cf-turnstile-widget"></div>
    </div>

    <button class="login-btn" id="login-btn" onclick="handleLogin()">
      🚀 Let's Go! 🎉
    </button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- DRAWER OVERLAY -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>

<!-- LEFT DRAWER -->
<div class="drawer" id="curriculum-drawer">
  <div class="drawer-header">
    <div class="drawer-title">📚 My Learning Path 🌟</div>
    <button class="drawer-close" onclick="closeDrawer()" title="Close">✕</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-section-label">🎯 Click a topic to explore it! 🚀</div>
    <div id="curriculum-list"></div>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">

  <div class="chat-header">
    <div class="header-left">
      <button class="menu-btn" id="menu-btn" onclick="openDrawer()" title="Open curriculum menu">
        <span></span><span></span><span></span>
      </button>
      <div class="header-info">
        <div class="header-chip">📚 <span id="hdr-board">—</span></div>
        <div class="header-chip">🏫 <span id="hdr-class">—</span></div>
        <div class="header-chip">📖 <span id="hdr-subject">—</span></div>
      </div>
    </div>

    <!-- ★ Music now-playing badge — visible only while teacher is thinking ★ -->
    <div class="music-indicator" id="music-indicator">
      <div class="music-bars">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      🎵 Maria is Thinking…
    </div>

    <div class="student-badge">
      🌟 <span id="hdr-student">—</span>'s Session
    </div>
  </div>

  <div class="chat-body">
    <div class="chat-area">
      <div class="messages-wrap" id="messages-wrap">

        <div class="msg msg-system">
          <div class="msg-avatar avatar-system">
            <img id="teacher-avatar-img"
                 src="https://raw.githubusercontent.com/buildwithsupratim/maria_V1.0/main/Picture_Teacher.jpg"
                 alt="Teacher Maria"
                 onerror="this.style.display='none'; this.parentElement.textContent='👩‍🏫';" />
          </div>
          <div class="msg-bubble" id="welcome-bubble">
            Hi! I'm your teacher today! 😊 Type your first message below to get started! 🎉🦋
          </div>
        </div>

        <div class="typing-indicator" id="typing-indicator">
          <div class="msg-avatar avatar-system">
            <img src="https://raw.githubusercontent.com/buildwithsupratim/maria_V1.0/main/Picture_Teacher.jpg"
                 alt="Teacher Maria"
                 onerror="this.style.display='none'; this.parentElement.textContent='👩‍🏫';" />
          </div>
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>

      </div>

      <div class="input-bar">
        <div class="input-col">
          <textarea class="input-textarea" id="msg-input"
                    rows="1" placeholder="Type your message here… 💬🌈"
                    oninput="onInputChange(this)" onkeydown="onInputKeydown(event)"></textarea>
          <div class="word-count" id="word-count">0 / 100 words</div>
        </div>
        <button class="icon-btn btn-voice" id="voice-btn" onclick="toggleVoice()" title="Voice input">🎤</button>
        <button class="icon-btn btn-send" id="send-btn" onclick="sendMessage()" title="Send message">➤</button>
      </div>
    </div>
  </div>
