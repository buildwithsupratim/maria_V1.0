<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌈 Learn & Play!</title>

  <!-- Cloudflare Turnstile loaded conditionally by JS (PROD only) -->

  <style>
    /* ===================== RESET & FONTS ===================== */
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:    #ff6fb7;
      --purple:  #a855f7;
      --blue:    #38bdf8;
      --green:   #4ade80;
      --yellow:  #fbbf24;
      --orange:  #fb923c;
      --red:     #f87171;
      --white:   #ffffff;
      --cream:   #fffbf0;
      --dark:    #2d1b69;
      --shadow:  0 8px 32px rgba(100,60,200,.18);
    }

    html, body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #fce4ff 0%, #e0f0ff 50%, #fff9e6 100%);
      overflow: hidden;
    }

    /* Floating stars BG */
    body::before {
      content: '⭐🌙✨🌟💫⭐✨';
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      font-size: 2rem; opacity: .08;
      white-space: nowrap;
      letter-spacing: 80px;
      line-height: 120px;
      pointer-events: none;
      z-index: 0;
      word-break: break-all;
    }

    /* ===================== LOGIN SCREEN ===================== */
    #login-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10;
      padding: 1rem;
    }

    .login-card {
      background: white;
      border-radius: 32px;
      padding: 2.5rem 2rem;
      width: min(480px, 100%);
      box-shadow: 0 20px 60px rgba(168,85,247,.25), 0 4px 16px rgba(0,0,0,.08);
      border: 4px solid var(--purple);
      position: relative;
      animation: popIn .6s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes popIn {
      from { transform: scale(.7) translateY(40px); opacity: 0; }
      to   { transform: scale(1) translateY(0);     opacity: 1; }
    }

    .login-deco {
      position: absolute; top: -32px; left: 50%; transform: translateX(-50%);
      font-size: 3.5rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,.2));
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(-12px); }
    }

    .login-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      text-align: center;
      margin-top: .8rem;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .login-subtitle {
      text-align: center;
      color: #888;
      font-size: .95rem;
      margin-bottom: 1.8rem;
      font-weight: 600;
    }

    .field-label {
      font-weight: 800; font-size: 1rem;
      color: var(--dark); margin-bottom: .4rem;
      display: flex; align-items: center; gap: .4rem;
    }

    .field-group { margin-bottom: 1.2rem; }

    .fancy-input {
      width: 100%;
      padding: .85rem 1.1rem;
      border-radius: 16px;
      border: 3px solid #e0d0ff;
      font-family: 'Nunito', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--dark);
      background: #faf5ff;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .fancy-input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 4px rgba(168,85,247,.18);
    }

    .cf-widget-wrap { margin: 1rem 0; display: flex; justify-content: center; }

    .login-btn {
      width: 100%;
      padding: 1rem;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      color: white;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 6px 20px rgba(168,85,247,.4);
      transition: transform .15s, box-shadow .15s;
      letter-spacing: .5px;
    }
    .login-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(168,85,247,.5); }
    .login-btn:active:not(:disabled) { transform: translateY(0); }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }

    .login-error {
      background: #ffe0e0; color: #c0392b;
      border-radius: 12px; padding: .7rem 1rem;
      font-weight: 700; font-size: .9rem;
      margin-top: .8rem; display: none;
      border: 2px solid #f9a8a8;
    }

    /* ===================== CHAT SCREEN ===================== */
    #chat-screen {
      display: none;
      position: fixed; inset: 0;
      flex-direction: column;
      z-index: 5;
    }

    /* --- TOP HEADER --- */
    .chat-header {
      background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 100%);
      color: white;
      padding: .7rem 1.2rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem;
      box-shadow: 0 4px 16px rgba(168,85,247,.3);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .header-info {
      display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
    }

    .header-chip {
      background: rgba(255,255,255,.22);
      border-radius: 20px; padding: .3rem .9rem;
      font-weight: 800; font-size: .85rem;
      display: flex; align-items: center; gap: .3rem;
      backdrop-filter: blur(4px);
      border: 1.5px solid rgba(255,255,255,.35);
    }

    .student-badge {
      background: var(--yellow);
      color: var(--dark);
      border-radius: 22px;
      padding: .4rem 1.1rem;
      font-family: 'Fredoka One', cursive;
      font-size: 1.05rem;
      display: flex; align-items: center; gap: .4rem;
      box-shadow: 0 3px 10px rgba(0,0,0,.15);
      animation: wobble 3s ease-in-out infinite;
    }

    @keyframes wobble {
      0%,100% { transform: rotate(-1deg); }
      50%      { transform: rotate(1deg); }
    }

    /* --- BODY (sidebar + chat) --- */
    .chat-body {
      display: flex; flex: 1; overflow: hidden;
    }

    /* --- LEFT SIDEBAR: Curriculum Progress --- */
    .sidebar {
      width: 270px; flex-shrink: 0;
      background: linear-gradient(180deg, #fce4ff 0%, #e8f4ff 100%);
      border-right: 3px solid #e0d0ff;
      overflow-y: auto;
      padding: 1rem .8rem;
      display: flex; flex-direction: column; gap: .8rem;
    }

    .sidebar-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      color: var(--purple);
      text-align: center;
      padding-bottom: .5rem;
      border-bottom: 2px dashed var(--purple);
      display: flex; align-items: center; gap: .4rem; justify-content: center;
    }

    .topic-card {
      background: white;
      border-radius: 16px;
      padding: .8rem;
      box-shadow: 0 3px 12px rgba(168,85,247,.1);
      border: 2px solid #f0e0ff;
      transition: transform .2s;
    }
    .topic-card:hover { transform: translateY(-2px); }

    .topic-name {
      font-weight: 800; font-size: .85rem;
      color: var(--dark); margin-bottom: .5rem;
      display: flex; align-items: center; gap: .3rem;
    }

    .progress-bar-wrap {
      background: #f0e8ff;
      border-radius: 10px; height: 10px;
      overflow: hidden; margin-bottom: .4rem;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 10px;
      transition: width .8s cubic-bezier(.34,1.56,.64,1);
      background: linear-gradient(90deg, var(--purple), var(--pink));
    }

    .progress-label {
      font-size: .75rem; font-weight: 700;
      display: flex; justify-content: space-between; align-items: center;
    }

    .stage-badge {
      border-radius: 10px; padding: .15rem .55rem;
      font-size: .7rem; font-weight: 800;
      letter-spacing: .3px;
    }
    .stage-yet   { background: #f0f0f0; color: #888; }
    .stage-progress { background: #fff3cd; color: #856404; }
    .stage-done  { background: #d1fae5; color: #065f46; }

    .obj-list {
      margin-top: .5rem; display: flex; flex-direction: column; gap: .3rem;
    }
    .obj-item {
      font-size: .72rem; color: #666; font-weight: 600;
      display: flex; align-items: center; gap: .35rem;
    }
    .obj-dots {
      display: flex; gap: 2px;
    }
    .obj-dot {
      width: 7px; height: 7px; border-radius: 50%;
    }
    .dot-done  { background: var(--green); }
    .dot-todo  { background: #e0e0e0; }

    /* --- CHAT AREA --- */
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; background: var(--cream);
      position: relative;
    }

    /* Bubbles BG decoration */
    .chat-area::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(168,85,247,.06) 60px, transparent 60px),
        radial-gradient(circle at 80% 70%, rgba(56,189,248,.06) 50px, transparent 50px),
        radial-gradient(circle at 50% 50%, rgba(251,191,36,.04) 80px, transparent 80px);
      pointer-events: none;
    }

    .messages-wrap {
      flex: 1; overflow-y: auto;
      padding: 1.2rem 1rem;
      display: flex; flex-direction: column; gap: .8rem;
      scroll-behavior: smooth;
    }

    /* Message bubbles */
    .msg {
      display: flex; align-items: flex-end; gap: .6rem;
      animation: slideUp .35s ease;
      max-width: 80%;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .msg-user   { align-self: flex-end; flex-direction: row-reverse; }
    .msg-system { align-self: flex-start; }

    .msg-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .avatar-user   { background: linear-gradient(135deg, var(--blue), var(--purple)); }
    .avatar-system { background: linear-gradient(135deg, var(--yellow), var(--orange)); }

    .msg-bubble {
      padding: .75rem 1.1rem;
      border-radius: 20px;
      font-size: .95rem; font-weight: 600; line-height: 1.5;
      max-width: 100%;
      position: relative;
    }
    .msg-user .msg-bubble {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 14px rgba(168,85,247,.3);
    }
    .msg-system .msg-bubble {
      background: white;
      color: var(--dark);
      border-bottom-left-radius: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,.1);
      border: 2px solid #f0e0ff;
    }

    /* Visual content panel */
    .visual-frame {
      background: white;
      border-radius: 16px;
      border: 2.5px solid var(--blue);
      padding: .8rem;
      margin-top: .5rem;
      max-width: 500px;
      box-shadow: 0 4px 16px rgba(56,189,248,.18);
      overflow: auto;
    }

    /* Typing indicator */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      align-items: flex-end; gap: .6rem;
    }
    .typing-indicator.show { display: flex; }
    .typing-dots {
      background: white;
      border: 2px solid #f0e0ff;
      border-radius: 20px; border-bottom-left-radius: 6px;
      padding: .7rem 1.1rem;
      display: flex; gap: 5px; align-items: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }
    .typing-dots span {
      width: 8px; height: 8px; background: var(--purple);
      border-radius: 50%; display: inline-block;
      animation: typingBounce 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes typingBounce {
      0%,60%,100% { transform: translateY(0); }
      30%           { transform: translateY(-8px); }
    }

    /* --- INPUT BAR --- */
    .input-bar {
      padding: .8rem 1rem;
      background: white;
      border-top: 3px solid #f0e0ff;
      display: flex; gap: .6rem; align-items: flex-end;
      box-shadow: 0 -4px 16px rgba(168,85,247,.07);
      flex-shrink: 0;
    }

    .input-textarea {
      flex: 1;
      resize: none;
      border: 3px solid #e0d0ff;
      border-radius: 18px;
      padding: .7rem 1rem;
      font-family: 'Nunito', sans-serif;
      font-size: .95rem;
      font-weight: 700;
      color: var(--dark);
      background: #faf5ff;
      outline: none;
      max-height: 120px;
      transition: border-color .2s;
      line-height: 1.4;
    }
    .input-textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(168,85,247,.15); }
    .input-textarea:disabled { opacity: .5; cursor: not-allowed; }

    .word-count {
      font-size: .72rem; font-weight: 700; color: #bbb;
      text-align: right; margin-top: .2rem; padding-right: .3rem;
    }
    .word-count.warn { color: var(--orange); }

    .input-col { flex: 1; display: flex; flex-direction: column; }

    .icon-btn {
      width: 46px; height: 46px; border-radius: 50%;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      transition: transform .15s, box-shadow .15s;
      flex-shrink: 0;
    }
    .icon-btn:hover:not(:disabled) { transform: scale(1.1); }
    .icon-btn:disabled { opacity: .45; cursor: not-allowed; }

    .btn-voice {
      background: linear-gradient(135deg, var(--blue), #6366f1);
      color: white;
      box-shadow: 0 4px 14px rgba(56,189,248,.35);
    }
    .btn-voice.recording {
      background: linear-gradient(135deg, var(--red), var(--orange));
      animation: pulse 1s ease-in-out infinite;
      box-shadow: 0 4px 14px rgba(248,113,113,.5);
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%       { transform: scale(1.12); }
    }

    .btn-send {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: white;
      box-shadow: 0 4px 14px rgba(168,85,247,.35);
    }

    /* Scrollbar styling */
    .messages-wrap::-webkit-scrollbar,
    .sidebar::-webkit-scrollbar { width: 6px; }
    .messages-wrap::-webkit-scrollbar-track,
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .messages-wrap::-webkit-scrollbar-thumb { background: rgba(168,85,247,.3); border-radius: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(168,85,247,.25); border-radius: 3px; }

    /* Spinner for login */
    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: .4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 640px) {
      .sidebar { width: 200px; }
      .header-chip { font-size: .75rem; padding: .25rem .7rem; }
    }
    @media (max-width: 480px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<!-- ====================================================
     LOGIN SCREEN
==================================================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-deco">🎒</div>
    <h1 class="login-title">Learn & Play! 🌈</h1>
    <p class="login-subtitle">Let's start today's adventure! ✨</p>

    <div class="field-group">
      <div class="field-label">🔑 Lesson Code</div>
      <input class="fancy-input" id="lesson-code" type="text"
             placeholder="Enter your lesson code…" autocomplete="off" />
    </div>

    <div class="field-group">
      <div class="field-label">👤 Your Name</div>
      <input class="fancy-input" id="student-name-input" type="text"
             placeholder="What's your name?" autocomplete="off" />
    </div>

    <!-- Cloudflare Turnstile widget -->
    <div class="cf-widget-wrap">
      <div id="cf-turnstile-widget"></div>
    </div>

    <button class="login-btn" id="login-btn" onclick="handleLogin()">
      🚀 Let's Go!
    </button>

    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ====================================================
     CHAT SCREEN
==================================================== -->
<div id="chat-screen">

  <!-- HEADER -->
  <div class="chat-header">
    <div class="header-info">
      <div class="header-chip">📚 <span id="hdr-board">—</span></div>
      <div class="header-chip">🏫 Class <span id="hdr-class">—</span></div>
      <div class="header-chip">📖 <span id="hdr-subject">—</span></div>
    </div>
    <div class="student-badge">
      ✏️ <span id="hdr-student">—</span>'s Session
    </div>
  </div>

  <!-- BODY: sidebar + chat -->
  <div class="chat-body">

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-title">📋 My Journey</div>
      <div id="curriculum-list"><!-- populated by JS --></div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area">
      <div class="messages-wrap" id="messages-wrap">

        <!-- Welcome message -->
        <div class="msg msg-system">
          <div class="msg-avatar avatar-system">🦉</div>
          <div class="msg-bubble" id="welcome-bubble">
            Hi! I'm your teacher today! 😊 Type or speak your first message below to get started! 🎉
          </div>
        </div>

        <!-- Typing indicator -->
        <div class="typing-indicator" id="typing-indicator">
          <div class="msg-avatar avatar-system">🦉</div>
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        </div>

      </div>

      <!-- INPUT BAR -->
      <div class="input-bar">
        <div class="input-col">
          <textarea class="input-textarea" id="msg-input"
                    rows="1" placeholder="Type your message here… 💬"
                    oninput="onInputChange(this)" onkeydown="onInputKeydown(event)"></textarea>
          <div class="word-count" id="word-count">0 / 100 words</div>
        </div>
        <button class="icon-btn btn-voice" id="voice-btn"
                onclick="toggleVoice()" title="Voice input">🎤</button>
        <button class="icon-btn btn-send" id="send-btn"
                onclick="sendMessage()" title="Send message">➤</button>
      </div>
    </div>

  </div>
</div>

     JAVASCRIPT
==================================================== -->
